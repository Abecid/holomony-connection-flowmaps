[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holonomy-connection-flowmaps"
version = "0.1.0"
description = "Controlled-connection holonomy flow maps: local vector fields, rollouts, holonomy matching, and flat/PiFM-style baselines."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "tqdm>=4.66",
  "pytest>=8.0",
  "wandb>=0.16"
]

[tool.setuptools]
packages = ["holoflow_conn"]
